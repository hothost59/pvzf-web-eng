<!doctype html>
<meta charset="utf-8">
<title>Plants vs Zombies Fusion</title>
<style>
  :root{ --bg:#10180f; --ink:#e8f3e4; --dim:#9ab094; --accent:#8bc34a; --track:#24341f; }
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid; place-items:center; padding:24px; box-sizing:border-box;
  }
  .wrap{width:100%;max-width:380px}
  button{
    appearance:none;border:0;border-radius:10px;cursor:pointer;width:100%;
    background:var(--accent);color:#10180f;font:600 16px/1 inherit;padding:14px 22px;
  }
  button:hover{filter:brightness(1.08)}
  button[disabled]{filter:grayscale(.6) brightness(.8);cursor:default}
  .bar{height:10px;background:var(--track);border-radius:999px;overflow:hidden;margin-top:18px}
  .fill{height:100%;width:0;background:var(--accent);transition:width .18s ease}
  #msg{margin-top:10px;font-size:13px;color:var(--dim);min-height:1.2em;text-align:center}
  #msg.bad{color:#ff8a7a}
</style>

<div class="wrap">
  <button id="play">Play</button>
  <div class="bar" id="bar" hidden><div class="fill" id="fill"></div></div>
  <div id="msg"></div>
</div>

<script>
/* ------------------------------------------------------------------
   REPO     "user/repo@branch"
   SOURCE   "jsdelivr" | "raw" | "local"  (see README)
   ------------------------------------------------------------------ */
const REPO   = "hothost59/pvzf-web-eng@main";
const SOURCE = "jsdelivr";

const [REPO_PATH, REPO_REF] = REPO.split("@");
const REF = REPO_REF || "main";
const BASE =
  SOURCE === "jsdelivr" ? "https://cdn.jsdelivr.net/gh/" + REPO_PATH + "@" + REF + "/" :
  SOURCE === "raw"      ? "https://raw.githubusercontent.com/" + REPO_PATH + "/" + REF + "/" :
                          new URL(".", location.href).href;

/* The boot program and the expected digests are embedded, never fetched:
   jsDelivr caches @branch URLs for ~12h, so a fetched copy would keep running
   the previous version long after a push. Regenerate with build.py. */
/*__BOOT_SRC__*/null
/*__DIGESTS__*/null

const play = document.getElementById("play");
const bar  = document.getElementById("bar");
const fill = document.getElementById("fill");
const msg  = document.getElementById("msg");

/* same markup in the child window, so boot.js drives either one */
const SHELL =
  '<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;' +
  'font:15px ui-sans-serif,system-ui,sans-serif}' +
  '#unity-canvas{position:fixed;left:0;top:0;display:block}' +
  '#ui{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,80vw)}' +
  '#bar{height:10px;background:#24341f;border-radius:999px;overflow:hidden}' +
  '#fill{height:100%;width:0;background:#8bc34a;transition:width .18s ease}' +
  '#msg{margin-top:10px;font-size:13px;color:#9ab094;text-align:center}' +
  '#msg.bad{color:#ff8a7a}</style>' +
  '<canvas id="unity-canvas" tabindex="-1"></canvas>' +
  '<div id="ui"><div id="bar"><div id="fill"></div></div><div id="msg"></div></div>';

function boot(doc, win) {
  win.__PVZ_BASE__ = BASE;
  win.__PVZ_DIGESTS__ = DIGESTS;
  /* mirror the child's progress onto this page's bar */
  win.__PVZ_PROGRESS__ = (frac, text, isBad) => {
    fill.style.width = Math.round(frac * 100) + "%";
    msg.textContent = text || "";
    msg.className = isBad ? "bad" : "";
  };
  const el = doc.createElement("script");
  el.textContent = BOOT_SRC;
  doc.head.appendChild(el);
}

function bootHere() {
  document.body.innerHTML = SHELL;
  boot(document, window);
}

play.addEventListener("click", () => {
  play.disabled = true;
  bar.hidden = false;
  fill.style.width = "0%";
  msg.className = "";
  msg.textContent = "Opening…";

  const win = window.open("about:blank", "_blank");
  if (!win) {
    msg.className = "bad";
    msg.textContent = "Popup blocked — loading here instead…";
    bootHere();
    return;
  }
  win.document.write(
    '<!doctype html><meta charset="utf-8"><title>Plants vs Zombies Fusion</title>' + SHELL
  );
  win.document.close();
  boot(win.document, win);
});
</script>
