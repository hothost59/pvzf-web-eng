<!doctype html>
<meta charset="utf-8">
<title>Plants vs Zombies Fusion</title>
<style>
  :root{
    --bg:#10180f; --panel:#1b2a19; --edge:#2f4a2c;
    --ink:#e8f3e4; --dim:#9ab094; --accent:#8bc34a; --accent-ink:#10180f;
  }
  html,body{height:100%;margin:0}
  body{
    background:radial-gradient(ellipse at 50% -10%,#1e3019,var(--bg) 70%);
    color:var(--ink);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:grid;place-items:center;padding:24px;box-sizing:border-box;
  }
  .card{
    width:100%;max-width:560px;background:var(--panel);
    border:1px solid var(--edge);border-radius:14px;padding:28px 26px;
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  h1{margin:0 0 4px;font-size:22px;letter-spacing:.2px}
  .sub{margin:0 0 22px;color:var(--dim);font-size:13px}
  button{
    appearance:none;border:0;border-radius:10px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);
    font:600 16px/1 inherit;padding:14px 22px;width:100%;
    transition:filter .12s ease,transform .06s ease;
  }
  button:hover{filter:brightness(1.08)}
  button:active{transform:translateY(1px)}
  button[disabled]{filter:grayscale(.6) brightness(.8);cursor:default}
  .meta{margin-top:20px;border-top:1px solid var(--edge);padding-top:16px;
        color:var(--dim);font-size:12.5px}
  .meta code{color:var(--ink);background:#0d140c;padding:1px 5px;border-radius:4px;
             font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
  .row{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
  #note{margin-top:14px;font-size:13px;color:var(--dim);min-height:1.5em}
  #note.bad{color:#ff8a7a}
</style>

<div class="card">
  <h1>Plants vs Zombies Fusion</h1>
  <p class="sub">WebGL build 2.0.4 &middot; English &middot; reassembled from 17 pieces</p>

  <button id="play">Play</button>
  <div id="note"></div>

  <div class="meta">
    <div class="row"><span>Source</span><span id="m-src">&mdash;</span></div>
    <div class="row"><span>Download</span><span id="m-size">&mdash;</span></div>
    <div class="row"><span>Parts</span><span id="m-parts">&mdash;</span></div>
    <p style="margin:12px 0 0">Opens in a blank tab. The whole build is fetched into
    memory before the game starts, so the first launch takes a while and needs about
    <strong>1&nbsp;GB</strong> of free RAM. Cached by the browser afterwards.</p>
  </div>
</div>

<script>
/* ------------------------------------------------------------------
   REPO     "user/repo@branch"
   SOURCE   where the chunks are fetched from:
              "jsdelivr" - cdn.jsdelivr.net. Works because each chunk is
                           requested as its own file; jsDelivr only refuses
                           when it has to package the repo. Cold files can
                           answer 403 briefly - boot.js retries those.
              "raw"      - raw.githubusercontent.com. No CDN, may rate-limit.
              "local"    - same folder as this page (use with GitHub Pages).
   Chunks are size-checked against manifest.json and the assembled files are
   SHA-256 verified, because a dropped connection can return HTTP 200 with a
   short body.
   ------------------------------------------------------------------ */
const REPO   = "hothost59/pvzf-web-eng@main";
const SOURCE = "jsdelivr";

const [REPO_PATH, REPO_REF] = REPO.split("@");
const REF = REPO_REF || "main";
const BASE =
  SOURCE === "jsdelivr" ? "https://cdn.jsdelivr.net/gh/" + REPO_PATH + "@" + REF + "/" :
  SOURCE === "raw"      ? "https://raw.githubusercontent.com/" + REPO_PATH + "/" + REF + "/" :
                          new URL(".", location.href).href;

const note = document.getElementById("note");
const play = document.getElementById("play");

function fmt(b) { return (b / 1048576).toFixed(0) + " MB"; }
function bad(t) { note.className = "bad"; note.textContent = t; }

document.getElementById("m-src").textContent =
  SOURCE === "jsdelivr" ? "jsDelivr" :
  SOURCE === "raw" ? "raw.githubusercontent.com" : "this site";

fetch(BASE + "manifest.json").then(r => r.json()).then(m => {
  const files = Object.values(m.files);
  document.getElementById("m-size").textContent =
    fmt(files.reduce((n, f) => n + f.total, 0));
  document.getElementById("m-parts").textContent =
    files.reduce((n, f) => n + f.parts.length, 0) + " × " + fmt(m.chunkSize);
}).catch(() => bad("Could not read manifest.json from " + BASE));

const SHELL =
  '<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}' +
  '#unity-canvas{position:fixed;left:0;top:0;display:block}' +
  '#boot{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);' +
  'text-align:center;color:#8bc34a;font:15px ui-monospace,Menlo,monospace}</style>' +
  '<canvas id="unity-canvas" tabindex="-1"></canvas><div id="boot">starting…</div>';

/* The boot program is embedded, not fetched. Fetching it from the CDN meant
   running whatever jsDelivr had cached for the branch (up to ~12h stale), and
   raw.githubusercontent.com serves .js as text/plain + nosniff which browsers
   refuse to execute. Regenerate with build.py after editing boot.js. */
const BOOT_SRC = "/* Runs inside the about:blank window. Fetches chunks, reassembles, starts Unity. */\n(function () {\n  var BASE = window.__PVZ_BASE__ || \"./\";\n  var DIGESTS = window.__PVZ_DIGESTS__ || null;\n  var canvas = document.getElementById(\"unity-canvas\");\n  var msg = document.getElementById(\"boot\");\n  function say(t) { if (msg) msg.textContent = t; }\n\n  function fit() {\n    var w = window.innerWidth, h = window.innerHeight;\n    canvas.style.width = w + \"px\"; canvas.style.height = h + \"px\";\n    canvas.width = w; canvas.height = h;\n  }\n  fit(); window.addEventListener(\"resize\", fit);\n\n  /* Retries MUST bypass the HTTP cache. jsDelivr answers 403 (\"Package size\n     exceeded...\") on a file it has not pulled from origin yet, and that error\n     response is cacheable - with cache:\"force-cache\" every retry replays the\n     cached 403 in a few ms without hitting the network, so the download can\n     never recover. The same applies to a truncated 200. First attempt may use\n     the cache (fast relaunches); every retry forces a fresh request. */\n  function get(url, type, attempt, fresh) {\n    attempt = attempt || 0;\n    return fetch(url, { cache: fresh ? \"reload\" : \"force-cache\" }).then(function (r) {\n      if (!r.ok) {\n        var retriable = r.status === 403 || r.status === 429 || r.status >= 500;\n        if (retriable && attempt < 8) {\n          var wait = Math.min(1000 * Math.pow(2, attempt), 10000);\n          say(\"waiting for CDN on \" + url.split(\"/\").pop() + \" (HTTP \" + r.status + \")\");\n          return new Promise(function (ok) { setTimeout(ok, wait); })\n            .then(function () { return get(url, type, attempt + 1, true); });\n        }\n        throw new Error(url + \" -> HTTP \" + r.status);\n      }\n      return type === \"text\" ? r.text() : r.arrayBuffer();\n    });\n  }\n\n  var done = 0, totalParts = 0;\n  function tick() { say(\"downloading \" + done + \"/\" + totalParts + \" parts\"); }\n\n  /* A chunk can come back HTTP 200 but short: the CDN uses chunked transfer\n     encoding (no Content-Length), so a dropped connection looks like a clean\n     small response. Every part is checked against the size in the manifest and\n     refetched if it does not match, otherwise the build corrupts silently. */\n  function fetchPart(part, tries) {\n    tries = tries || 0;\n    return get(BASE + \"chunks/\" + part.name, null, 0, tries > 0).then(function (ab) {\n      if (ab.byteLength === part.size) return ab;\n      if (tries < 5) {\n        say(\"short read on \" + part.name + \" (\" + ab.byteLength + \"/\" + part.size + \"), refetching\");\n        return new Promise(function (ok) { setTimeout(ok, 800 * (tries + 1)); })\n          .then(function () { return fetchPart(part, tries + 1); });\n      }\n      throw new Error(part.name + \" truncated: \" + ab.byteLength + \" of \" + part.size);\n    });\n  }\n\n  // fetch one file's chunks with limited concurrency, preserving order\n  function fetchChunks(spec) {\n    var parts = spec.parts, buf = new Uint8Array(spec.total), at = [], off = 0;\n    parts.forEach(function (p) { at.push(off); off += p.size; });\n    var next = 0, LIMIT = 3;\n    function worker() {\n      if (next >= parts.length) return Promise.resolve();\n      var i = next++;\n      return fetchPart(parts[i]).then(function (ab) {\n        buf.set(new Uint8Array(ab), at[i]);\n        done++; tick();\n        return worker();\n      });\n    }\n    var runners = [];\n    for (var k = 0; k < Math.min(LIMIT, parts.length); k++) runners.push(worker());\n    return Promise.all(runners).then(function () { return buf; });\n  }\n\n  function hex(ab) {\n    return Array.prototype.map.call(new Uint8Array(ab), function (b) {\n      return (\"0\" + b.toString(16)).slice(-2);\n    }).join(\"\");\n  }\n\n  var CRC_T = (function () {\n    var t = new Uint32Array(256);\n    for (var n = 0; n < 256; n++) {\n      var c = n;\n      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);\n      t[n] = c >>> 0;\n    }\n    return t;\n  })();\n\n  function crc32(buf) {\n    var c = 0xFFFFFFFF;\n    for (var i = 0; i < buf.length; i++) c = CRC_T[(c ^ buf[i]) & 0xFF] ^ (c >>> 8);\n    return ((c ^ 0xFFFFFFFF) >>> 0).toString(16).padStart(8, \"0\");\n  }\n\n  /* Integrity is never skipped. crypto.subtle only exists in a secure context,\n     so opening the launcher from file:// (origin null) has no SHA-256 - that is\n     exactly when a corrupt download goes unnoticed and surfaces later as a wasm\n     \"function signature mismatch\". CRC32 in plain JS covers that case. */\n  function verify(name, buf, want) {\n    var expect = (DIGESTS && DIGESTS[name]) || want || {};\n    if (self.crypto && self.crypto.subtle && expect.sha256) {\n      say(\"verifying \" + name + \" (sha256)\");\n      return crypto.subtle.digest(\"SHA-256\", buf).then(function (d) {\n        var got = hex(d);\n        if (got !== expect.sha256) {\n          throw new Error(name + \" is corrupt: sha256 \" + got.slice(0, 16) +\n            \" != \" + expect.sha256.slice(0, 16) + \" - reload to refetch\");\n        }\n        return buf;\n      });\n    }\n    if (expect.crc32) {\n      say(\"verifying \" + name + \" (crc32)\");\n      var got = crc32(buf);\n      if (got !== expect.crc32) {\n        throw new Error(name + \" is corrupt: crc32 \" + got + \" != \" + expect.crc32 +\n          \" - reload to refetch\");\n      }\n      return Promise.resolve(buf);\n    }\n    throw new Error(\"no checksum available for \" + name + \"; refusing to boot\");\n  }\n\n  say(\"fetching manifest\");\n  get(BASE + \"manifest.json\", \"text\").then(function (t) {\n    var man = JSON.parse(t);\n    totalParts = man.files.data.parts.length + man.files.wasm.parts.length;\n    tick();\n    return Promise.all([\n      fetchChunks(man.files.data).then(function (b) { return verify(\"build.data\", b, man.files.data); }),\n      fetchChunks(man.files.wasm).then(function (b) { return verify(\"build.wasm\", b, man.files.wasm); }),\n      get(BASE + \"build.loader.js\", \"text\"),\n      get(BASE + \"build.framework.js\", \"text\")\n    ]);\n  }).then(function (r) {\n    var dataBuf = r[0], wasmBuf = r[1], loaderSrc = r[2], frameworkSrc = r[3];\n    say(\"starting engine\");\n\n    var dataUrl = URL.createObjectURL(new Blob([dataBuf], { type: \"application/octet-stream\" }));\n    var codeUrl = URL.createObjectURL(new Blob([wasmBuf], { type: \"application/wasm\" }));\n    var fwUrl   = URL.createObjectURL(new Blob([frameworkSrc], { type: \"text/javascript\" }));\n\n    // run the Unity loader in this document\n    var s = document.createElement(\"script\");\n    s.textContent = loaderSrc;\n    document.head.appendChild(s);\n\n    return createUnityInstance(canvas, {\n      dataUrl: dataUrl,\n      frameworkUrl: fwUrl,\n      codeUrl: codeUrl,\n      streamingAssetsUrl: \"StreamingAssets\",\n      companyName: \"LanPiaoPiao\",\n      productName: \"PlantsVsZombiesRH\",\n      productVersion: \"1.0\",\n      matchWebGLToCanvasSize: true\n    }, function (p) { say(\"loading \" + Math.round(p * 100) + \"%\"); })\n    .then(function () {\n      if (msg) msg.remove();\n      URL.revokeObjectURL(dataUrl); URL.revokeObjectURL(codeUrl); URL.revokeObjectURL(fwUrl);\n      fit();\n    });\n  }).catch(function (e) {\n    say(\"failed: \" + (e && e.message ? e.message : e));\n    console.error(e);\n  });\n})();\n";
const DIGESTS = {"build.data": {"sha256": "d8122a389ffaf273c65df2c8ed01c249910812078e909f5be1bcd96b47e3b9fa", "crc32": "6cf35f7a"}, "build.wasm": {"sha256": "34d038ccc94a6dc7df0719d7cb4bc8054562f0af3470c9e0825d5cc219e33aab", "crc32": "615b7710"}};

function boot(doc, win) {
  win.__PVZ_BASE__ = BASE;
  /* digests are embedded too: manifest.json is fetched from the CDN and can be
     up to ~12h stale, so it is not a trustworthy source for the expected hashes */
  win.__PVZ_DIGESTS__ = DIGESTS;
  const el = doc.createElement("script");
  el.textContent = BOOT_SRC;
  doc.head.appendChild(el);
}

/* fallback when the browser blocks the popup: take over this tab */
function bootHere() {
  document.body.innerHTML = SHELL;
  boot(document, window);
}

play.addEventListener("click", () => {
  const win = window.open("about:blank", "_blank");

  if (!win) {
    bad("The popup was blocked — allow popups for this page, or:");
    const alt = document.createElement("button");
    alt.textContent = "Play in this tab instead";
    alt.style.marginTop = "10px";
    alt.addEventListener("click", bootHere);
    note.appendChild(alt);
    play.disabled = true;
    return;
  }

  win.document.write(
    '<!doctype html><meta charset="utf-8"><title>Plants vs Zombies Fusion</title>' + SHELL
  );
  win.document.close();
  boot(win.document, win);

  note.className = "";
  note.textContent = "Launched in a new tab. Keep this tab open.";
  play.disabled = true;
  setTimeout(() => { play.disabled = false; }, 3000);
});
</script>
